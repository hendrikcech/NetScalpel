name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The code is Linux-only (raw sockets, tcpinfo, sendmmsg).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Allow the BBR congestion control for unprivileged sockets
        # Best effort: without it the BBR tests skip instead of failing.
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.ipv4.tcp_allowed_congestion_control="reno cubic bbr" || true

      - run: go vet ./...

      # ST1005 is excluded in staticcheck.conf.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
        continue-on-error: true

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        continue-on-error: true

      - run: go build ./...

      # gotestsum reruns individual failed tests to absorb rare timing
      # flakes on shared runners; a test that fails twice fails the build.
      # sudo is passwordless on GitHub runners, so the tcpdump tests run
      # here even though they skip on typical dev machines.
      - name: go test
        run: >
          go run gotest.tools/gotestsum@v1.13.0
          --format testname
          --rerun-fails=2
          --packages=./...
          -- -race -shuffle=on -timeout 300s

  # Fails fast, e.g., on a stale vendorHash in scalpel.nix
  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix build .#scalpel-run --no-link

  # End-to-end validation: client and server across an emulated netem link,
  # asserting that the measured OWD/loss/rate values in the produced CSVs
  # match the configured ground truth. See e2e/README.md.
  e2e:
    needs: nix-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [owd, loss, rate, asym, icmp-udp, tcp]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # Ubuntu 24.04 blocks unprivileged user namespaces by default, which
      # nixnet needs to build the testbed without root.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run e2e ${{ matrix.scenario }}
        run: nix run ./e2e#${{ matrix.scenario }}
